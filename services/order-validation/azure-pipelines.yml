# The order validation pipeline: the golden-path template with our three values.
trigger:
  branches: {include: [main]}

variables:
  releaseLabels: ""          # rollback / reliability-fix / budget-exception when the gate needs it

extends:
  template: golden-path/pipeline/templates/service.yml
  parameters:
    service: order-validation
    servicePath: services/order-validation
    registry: myregistry.azurecr.io

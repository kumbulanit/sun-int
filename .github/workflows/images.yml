# Builds the three images and publishes them to GitHub's registry (ghcr.io), so that a
# `helm install` on any cluster can pull them. Nobody builds anything on their own machine.
#
# Each image's tag is its chart's appVersion. To ship a code change: bump appVersion in the
# chart and push to main. A version that's already published is never overwritten, so a
# tag always means the same code. Each build is also tagged sha-<commit>, for tracing.
name: images

on:
  push:
    branches: [main]
    paths: ["services/**", "tools/**", "charts/**", ".github/workflows/images.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # publish with the workflow's own token: no personal token needed

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {image: order-validation,       folder: services/order-validation, target: runtime, chart: charts/order-validation}
          - {image: order-validation-tests, folder: services/order-validation, target: test,    chart: charts/order-validation}
          - {image: pricing-fake,           folder: tools/pricing-fake,        target: "",      chart: charts/order-validation/charts/pricing-fake}
    steps:
      - uses: actions/checkout@v4

      - name: Which image and version
        id: version
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' "${{ matrix.chart }}/Chart.yaml")
          echo "image=ghcr.io/$owner/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: published
        run: |
          if docker manifest inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.image }} ${{ steps.version.outputs.version }} is already published, so it's left as it is. Changed the code? Bump appVersion in ${{ matrix.chart }}/Chart.yaml."
          fi

      - uses: docker/setup-qemu-action@v3     # to build the arm64 image too (Apple-silicon laptops)
        if: steps.published.outputs.already != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.already != 'true'
      - uses: docker/build-push-action@v6
        if: steps.published.outputs.already != 'true'
        with:
          context: ${{ matrix.folder }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          # Links the image to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

# The fake pricing service is a test double the platform team owns, not a product service:
# it has no SLO, so it isn't on the golden path. This only publishes its image, as its
# chart's appVersion (never overwriting a published version).
name: pricing-fake

on:
  push:
    branches: [main]
    paths: ["tools/pricing-fake/**", "charts/pricing-fake/Chart.yaml", ".github/workflows/pricing-fake.yml"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish the image as the chart's appVersion
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          image=$(grep -A3 '^image:' charts/pricing-fake/values.yaml | awk '/repository:/ {print $2; exit}')
          version=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/pricing-fake/Chart.yaml)
          golden-path/pipeline/publish.sh "$image" "$version" tools/pricing-fake

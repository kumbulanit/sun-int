# GENERATED from slo.yaml by golden-path/slo/generate.py. Do not edit: change slo.yaml, then run
# golden-path/slo/generate.sh charts/order-validation
# SLO: 99.95% of requests to /orders/validate are good (not a 5xx, answered within 0.25 s), over a rolling 28d. Error budget: 0.0500% of requests.
# burn rate = share of the budget spent x 672 h / long window hours:
#   SLOFastBurn    page     2% in 1h  (1h/5m windows): burn 13.44, error ratio > 0.6720%
#   SLOSlowBurn    page     5% in 6h  (6h/30m windows): burn  5.60, error ratio > 0.2800%
#   SLOBudgetLeak  ticket  10% in 3d  (3d/6h windows): burn  0.93, error ratio > 0.0467%
groups:
- name: order-validation-slo-recording
  rules:
  - record: slo:error_ratio:rate5m
    labels:
      service: order-validation
    expr: 1 - sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="order-validation",
      http_route="/orders/validate"}[5m]))
  - record: slo:error_ratio:rate30m
    labels:
      service: order-validation
    expr: 1 - sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[30m])) / sum(rate(http_server_request_duration_seconds_count{job="order-validation",
      http_route="/orders/validate"}[30m]))
  - record: slo:error_ratio:rate1h
    labels:
      service: order-validation
    expr: 1 - sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[1h])) / sum(rate(http_server_request_duration_seconds_count{job="order-validation",
      http_route="/orders/validate"}[1h]))
  - record: slo:error_ratio:rate6h
    labels:
      service: order-validation
    expr: 1 - sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[6h])) / sum(rate(http_server_request_duration_seconds_count{job="order-validation",
      http_route="/orders/validate"}[6h]))
  - record: slo:error_ratio:rate3d
    labels:
      service: order-validation
    expr: 1 - sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[3d])) / sum(rate(http_server_request_duration_seconds_count{job="order-validation",
      http_route="/orders/validate"}[3d]))
  - record: slo:good:rate5m
    labels:
      service: order-validation
    expr: sum(rate(http_server_request_duration_seconds_bucket{job="order-validation", http_route="/orders/validate", le="0.25", http_response_status_code!~"5.."}[5m]))
  - record: slo:total:rate5m
    labels:
      service: order-validation
    expr: sum(rate(http_server_request_duration_seconds_count{job="order-validation", http_route="/orders/validate"}[5m]))
  - record: slo:error_budget_remaining
    labels:
      service: order-validation
    expr: 1 - (1 - sum_over_time(slo:good:rate5m{service="order-validation"}[28d]) / sum_over_time(slo:total:rate5m{service="order-validation"}[28d])) / 0.0005
  - record: dependency:failure_ratio:rate10m
    labels:
      service: order-validation
      dependency: pricing
    expr: sum(rate(dependency_calls_total{job="order-validation", dependency="pricing", outcome!="ok"}[10m])) / sum(rate(dependency_calls_total{job="order-validation", dependency="pricing"}[10m]))
- name: order-validation-slo-alerts
  rules:
  - alert: SLOFastBurn
    expr: slo:error_ratio:rate1h{service="order-validation"} > 0.00672 and slo:error_ratio:rate5m{service="order-validation"} > 0.00672
    for: 1m
    labels:
      severity: page
      service: order-validation
      team: storefront
    annotations:
      summary: 'order-validation: at this rate 2% of the 28d error budget goes in 1h'
      runbook_url: services/order-validation/runbooks/pricing-slow.md
  - alert: SLOSlowBurn
    expr: slo:error_ratio:rate6h{service="order-validation"} > 0.0028 and slo:error_ratio:rate30m{service="order-validation"} > 0.0028
    for: 1m
    labels:
      severity: page
      service: order-validation
      team: storefront
    annotations:
      summary: 'order-validation: at this rate 5% of the 28d error budget goes in 6h'
      runbook_url: services/order-validation/runbooks/pricing-slow.md
  - alert: SLOBudgetLeak
    expr: slo:error_ratio:rate3d{service="order-validation"} > 0.000466667 and slo:error_ratio:rate6h{service="order-validation"} > 0.000466667
    for: 15m
    labels:
      severity: ticket
      service: order-validation
      team: storefront
    annotations:
      summary: 'order-validation: at this rate 10% of the 28d error budget goes in 3d'
      runbook_url: services/order-validation/runbooks/pricing-slow.md
  - alert: DependencyFailing
    expr: dependency:failure_ratio:rate10m{service="order-validation", dependency="pricing"} > 0.05
    for: 2m
    labels:
      severity: ticket
      service: order-validation
      team: storefront
      dependency: pricing
    annotations:
      summary: 'order-validation: more than 5% of calls to pricing are failing or timing out'
      runbook_url: services/order-validation/runbooks/pricing-slow.md

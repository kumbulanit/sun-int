# The order validation API. Installing it also installs its two dependencies
# (Chart.yaml): the pricing service and the database.

image:
  repository: ghcr.io/kumbulanit/order-validation   # built and published by .github/workflows/images.yml
  tag: ""                                            # empty = the chart's appVersion
  pullPolicy: IfNotPresent

replicas: 2   # at least 2, so one pod can restart without an outage. Raise it before the Saturday sale.

# Where its dependencies are. The defaults are the two charts installed with it.
database:
  host: postgres
  port: 5432
  name: order_validation
  user: order_validation
pricing:
  url: http://pricing-fake:8081
  fallbackEnabled: true   # when pricing is slow, answer from prices fetched in the last 60 s

# Shared with the two dependencies, so both ends always match. Local-only values: on a
# real cluster set your own, e.g. --set global.postgresPassword=... --set global.pricingToken=...
global:
  postgresPassword: local-dev-only
  pricingToken: local-dev-token

# The dependencies. false = bring your own, and point database/pricing above at it.
pricing-fake:
  enabled: true
postgres:
  enabled: true

logLevel: INFO
extraEnv: {}   # any other setting from app/settings.py, e.g. {PRICING_CACHE_TTL_S: "300"}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}   # no CPU limit: it would slow the app down exactly when it's busiest

# `helm test`: the 40 tests, run as a pod in the cluster. Same tag as the API.
tests:
  image:
    repository: ghcr.io/kumbulanit/order-validation-tests

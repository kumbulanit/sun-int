apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "postgres.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false     # Postgres never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                         # the postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70                           # so the mounted folders below are writable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
          ports:
            - name: postgres
              containerPort: 5432
          # Over TCP on purpose: while the seed is loading, Postgres listens only on a local
          # socket, so this stays "not ready" until the data is really there.
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.user | quote }}, -d, {{ .Values.database | quote }}]
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true      # it writes only to the folders mounted below
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: initdb
          configMap: {name: postgres-initdb}
        - name: data
          emptyDir: {}                        # for trying it out: a restart starts again from the seed
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

{{- /* Pricing's address inside the cluster: http://pricing-fake:8081. */}}
apiVersion: v1
kind: Service
metadata:
  name: pricing-fake
  labels:
    {{- include "pricing-fake.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pricing-fake
  ports:
    - name: http
      port: 8081
      targetPort: http

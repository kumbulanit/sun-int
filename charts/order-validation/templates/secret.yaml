{{- /* The API's own secret: the database address with its password, and the pricing token. */}}
apiVersion: v1
kind: Secret
metadata:
  name: order-validation
  labels:
    {{- include "golden-path.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $db := .Values.database }}
  {{- $password := required "global.postgresPassword is required" .Values.global.postgresPassword }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $db.user ($password | urlquery) $db.host $db.port $db.name | quote }}
  PRICING_TOKEN: {{ required "global.pricingToken is required" .Values.global.pricingToken | quote }}

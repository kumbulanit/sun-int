apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-validation
  labels:
    {{- include "order-validation.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-validation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never below full capacity during a deploy...
      maxSurge: 1         # ...one new pod at a time; it must be ready before an old one goes
  template:
    metadata:
      labels:
        {{- include "order-validation.labels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}   # new credentials restart the pods
    spec:
      automountServiceAccountToken: false     # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: 20       # the 5 s pre-stop wait plus the app's own 10 s shutdown
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Helm installs everything at once. The API can't start without its database, so this
        # waits until the database answers. It does NOT wait for pricing, on purpose: if pricing
        # is down, the API must still start (and fill its price cache once pricing is back).
        - name: wait-for-database
          image: "{{ .Values.image.repository }}:{{ include "order-validation.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, time
              while True:
                  try:
                      socket.create_connection(("{{ .Values.database.host }}", {{ .Values.database.port }}), timeout=2).close()
                      break
                  except OSError:
                      print("waiting for the database at {{ .Values.database.host }}:{{ .Values.database.port }}", flush=True)
                      time.sleep(2)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            {{- include "order-validation.containerSecurity" . | nindent 12 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ include "order-validation.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PRICING_URL
              value: {{ .Values.pricing.url | quote }}
            - name: PRICING_FALLBACK_ENABLED
              value: {{ .Values.pricing.fallbackEnabled | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: OTEL_SDK_DISABLED     # no telemetry yet: that arrives with the golden path
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: order-validation, key: DATABASE_URL}
            - name: PRICING_TOKEN
              valueFrom:
                secretKeyRef: {name: order-validation, key: PRICING_TOKEN}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # Readiness checks only that the pod has started, never the database or pricing:
          # every pod shares those, so failing on them would take all pods out at once.
          readinessProbe:                     # ~10 s failing: stop sending it traffic
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:                      # ~30 s failing: restart it
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "order-validation.containerSecurity" . | nindent 12 }}
          lifecycle:
            preStop:
              # Wait 5 s before shutting down, so the cluster has stopped sending traffic
              # here first. Without it, a few requests fail on every deploy.
              sleep:
                seconds: 5

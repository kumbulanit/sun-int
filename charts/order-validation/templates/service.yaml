{{- /* The API's address inside the cluster: http://order-validation:8080. */}}
apiVersion: v1
kind: Service
metadata:
  name: order-validation
  labels:
    {{- include "order-validation.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: order-validation
  ports:
    - name: http
      port: 8080
      targetPort: http

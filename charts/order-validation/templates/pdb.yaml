{{- /* Node drains and cluster upgrades may stop only one pod at a time, so the API
       never goes to zero. Skipped for a single pod, where it would block drains. */}}
{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-validation
  labels:
    {{- include "order-validation.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-validation
{{- end }}

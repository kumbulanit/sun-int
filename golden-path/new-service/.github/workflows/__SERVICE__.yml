# __SERVICE__'s pipeline: the golden path does everything (golden-path/README.md, "Your pipeline").
name: __SERVICE__

on:
  push:
    branches: [main]
    paths: ["services/__SERVICE__/**", "charts/__SERVICE__/**", "golden-path/**"]
  pull_request:
    paths: ["services/__SERVICE__/**", "charts/__SERVICE__/**", "golden-path/**"]
  workflow_dispatch:
    inputs:
      release-labels:
        description: first-deploy, rollback, reliability-fix or budget-exception, when the release rules need one
        default: ""

jobs:
  golden-path:
    uses: ./.github/workflows/golden-path.yml
    with:
      service: __SERVICE__
      release-labels: ${{ inputs.release-labels || '' }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

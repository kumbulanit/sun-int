{{- /* Prometheus, plus the rules collector: a small helper in the same pod that finds every
       ConfigMap labelled golden-path/slo-rules in any namespace (each service's chart makes
       one), copies it in, and tells Prometheus to reload. A new service's alerts appear
       without anyone touching the platform. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels:
    {{- include "platform.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- .Files.Get "files/prometheus.yml" | nindent 4 }}
  platform.rules.yaml: |
    {{- .Files.Get "files/platform.rules.yaml" | nindent 4 }}
---
# The rules collector may only read ConfigMaps: nothing else, and it can't change anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-rules
  labels:
    {{- include "platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-prometheus-rules
  labels:
    {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-prometheus-rules
  labels:
    {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-prometheus-rules
subjects:
  - kind: ServiceAccount
    name: prometheus-rules
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  strategy: {type: Recreate}   # one at a time: two would each keep half the data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        {{- include "platform.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/prometheus.yml") (.Files.Get "files/platform.rules.yaml") | sha256sum }}
    spec:
      serviceAccountName: prometheus-rules   # used by the rules collector only
      securityContext:
        {{- include "platform.podSecurity" . | nindent 8 }}
        runAsUser: 65534                     # nobody, the user both images are built for
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle          # lets the rules collector ask for a reload
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: config, mountPath: /etc/prometheus/rules/platform/platform.rules.yaml, subPath: platform.rules.yaml}
            - {name: service-rules, mountPath: /etc/prometheus/rules/services}
            - {name: data, mountPath: /prometheus}
        - name: rules-collector
          image: {{ .Values.images.rulesCollector }}
          env:
            - {name: LABEL, value: golden-path/slo-rules}
            - {name: LABEL_VALUE, value: "true"}
            - {name: RESOURCE, value: configmap}
            - {name: NAMESPACE, value: ALL}
            - {name: FOLDER, value: /etc/prometheus/rules/services}
            - {name: REQ_URL, value: "http://127.0.0.1:9090/-/reload"}
            - {name: REQ_METHOD, value: POST}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: service-rules, mountPath: /etc/prometheus/rules/services}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: prometheus}
        - name: service-rules
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web}

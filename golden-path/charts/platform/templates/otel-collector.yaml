{{- /* Every service sends its metrics and traces here (http://otel-collector.platform:4318).
       This is where the cost controls are: see golden-path/telemetry/STANDARD.md. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    {{- include "platform.labels" . | nindent 4 }}
data:
  otel-collector.yaml: |
    {{- .Files.Get "files/otel-collector.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        {{- include "platform.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/otel-collector.yaml" | sha256sum }}   # a config change restarts it
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.podSecurity" . | nindent 8 }}
      containers:
        - name: otel-collector
          image: {{ .Values.images.collector }}
          args: ["--config=/etc/otelcol/otel-collector.yaml"]
          env:
            - name: TRACE_SAMPLE_PERCENT
              value: {{ .Values.traces.samplePercent | quote }}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8889, targetPort: metrics}
